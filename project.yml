name: UpdateBar
options:
  bundleIdPrefix: com.erole
  deploymentTarget:
    macOS: "27.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    DEVELOPMENT_TEAM: ""
packages:
  AppUpdater:
    url: https://github.com/erikrole/AppUpdater.git
    revision: 9ada219929d278da23a003382ed599d4590f78ec
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  UpdateBar:
    type: application
    platform: macOS
    sources:
      - UpdateBar
      - path: docs/brand/UpdateBar.icon
    dependencies:
      - package: AppUpdater
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erole.UpdateBar
        PRODUCT_NAME: UpdateBar
        MARKETING_VERSION: "0.1.5"
        CURRENT_PROJECT_VERSION: "7"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: UpdateBar/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: UpdateBar
        DEVELOPMENT_TEAM: T26T3G8C7Q
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    scheme:
      testTargets:
        - UpdateBarTests
  UpdateBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - UpdateBarTests
    dependencies:
      - target: UpdateBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erole.UpdateBarTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: T26T3G8C7Q
